<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Countries</title>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__title">Where in the world?</h1>
            <div class="header__choice-color">
                <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" class="header__icon">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12.0532 11.315C8.16857 11.315 5.01929 8.42783 5.01929 4.86821C5.01929 3.5253 5.46679 2.28158 6.23143 1.25C3.19036 2.19515 1 4.83122 1 7.93807C1 11.8385 4.44929 15 8.70357 15C12.0929 15 14.9696 12.9932 16 10.2045C14.875 10.9048 13.5161 11.315 12.0532 11.315Z" fill="white" stroke="#111517" stroke-width="1.25"/>
                </svg>
                <p class="header__text">Dark Mode</p>
            </div>
        </div>
    </header>
    <div class="container container__second">
    <main class="main-content">
        <button class="button button--back">
            <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M7.56991 0.370847L8.95692 1.69667L4.37977 6.07189L21.8562 6.07189L21.8562 7.92805L4.37977 7.92805L8.95692 12.3033L7.56991 13.6291L0.634821 6.99997L7.56991 0.370847Z" fill="#111517"/>
            </svg>
            Back
        </button>
        <div class="main-content__info">
            <img src="./media/Belgium.png" alt="Флаг Бельгии" class="main-content__img">
            <div class="main-content__container">
                <div class="main-content__details">
                    <h2 class="main-content__header">Belgium</h2>
                    <div class="main-content__stats">
                        <div class="main-content__stats--info-left">
                            <p class="main-content__text"><span class="main-content__highliths">Native Name:</span> België</p>
                            <p class="main-content__text"><span class="main-content__highliths">Population:</span> 11,319,511</p>
                            <p class="main-content__text"><span class="main-content__highliths">Region:</span> Europe</p>
                            <p class="main-content__text"><span class="main-content__highliths">Sub region:</span> Western</p>
                            <p class="main-content__text"><span class="main-content__highliths">Capital:</span> Brussels</p>
                        </div>
                        <div class="main-content__stats--info-right">
                            <p class="main-content__text"><span class="main-content__highliths">Top Level Domain:</span> .be</p>
                            <p class="main-content__text"><span class="main-content__highliths">Currencies:</span> Euro</p>
                            <p class="main-content__text"><span class="main-content__highliths">Languages:</span> Dutch, French, German</p>
                        </div>
                    </div>
                </div>
                <div class="main-content__borders">
                    <span class="main-content__highliths">Border Countries:</span> 
                    <div class="main-content__button">
                        <button class="button button--country">France</button> 
                        <button class="button button--country">Germany</button> 
                        <button class="button button--country">Netherlands</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    </div>
</body>
</html>
